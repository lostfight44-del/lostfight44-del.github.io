<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080f1c;--card:#0f1a2d;--ink:#e7f0fc;--mut:#8497b4;--line:#1c2b45;--g:#8ecbff;--g2:#5aa9e6;--au:#a9d8ff;--win:#4ade9a;--loss:#ff7b6b;--r:16px}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color-scheme:dark}
body{font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:5;background:rgba(8,15,28,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 20px 0}
.bar>div{max-width:980px;margin:auto;display:flex;align-items:center;gap:14px;padding-bottom:12px}
.brand{font:700 1.25rem Fraunces,serif;display:flex;align-items:center;gap:10px}
.brand i{font-style:normal;font:700 .68rem Inter;letter-spacing:.14em;color:#06101f;background:var(--g);padding:4px 9px;border-radius:99px}
.sp{flex:1}.who{font-size:.85rem;color:var(--mut)}
.nav{max-width:980px;margin:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.nav a{font-size:.85rem;font-weight:600;color:var(--mut);padding:9px 14px;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ink)}.nav a.on{color:var(--g);border-color:var(--g)}
.wrap{max-width:980px;margin:auto;padding:26px 20px 70px}
.hero{padding:10px 0 22px}
.hero small{color:var(--g);font-weight:700;letter-spacing:.16em;font-size:.72rem;text-transform:uppercase}
.hero h1{font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.1;margin:6px 0 8px}
.hero p{color:var(--mut);max-width:560px}
.sum{background:linear-gradient(135deg,#112543,#0c1a30);border:1px solid #1f3a60;color:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.sum div{border-left:1px solid rgba(142,203,255,.16);padding-left:16px}.sum div:first-child{border:0;padding:0}
.sum b{display:block;font:700 1.9rem Fraunces,serif}.sum span{font-size:.74rem;color:var(--mut);letter-spacing:.06em}
.sum .pos{color:var(--win)}.sum .neg{color:var(--loss)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cat h3{font-size:1rem;display:flex;gap:8px;align-items:center}.cat p{color:var(--mut);font-size:.8rem;margin-top:6px}
.cat b{color:var(--g);font-size:1.15rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .85rem Inter;padding:9px 16px;border-radius:99px;cursor:pointer}
.tab.on{background:var(--g);color:#06101f;border-color:var(--g)}
.tabs.sub .tab{font-weight:500;font-size:.8rem;padding:6px 12px}.tabs.sub .tab.on{background:#1d3558;color:var(--g);border-color:#2b4c7a}
.tip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:4px 1fr auto;gap:16px;align-items:center}
.tip .st{align-self:stretch;border-radius:4px;background:var(--line)}
.tip.win .st{background:var(--win)}.tip.loss .st{background:var(--loss)}.tip.void .st{background:#56688a}.tip.pend .st{background:var(--g2)}
.meta{font-size:.75rem;color:var(--mut);letter-spacing:.03em;margin-bottom:3px}
.match{font:700 1.05rem Fraunces,serif}
.pick{margin-top:6px;font-size:.9rem}.pick b{background:#15294a;color:var(--g);padding:2px 10px;border-radius:99px}
.note{color:var(--mut);font-size:.82rem;margin-top:6px}
.right{text-align:right}.odd{font:700 1.4rem Fraunces,serif;color:var(--au)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:99px;margin-top:4px;border:0;font-family:inherit}
.pill.pend{background:#16294a;color:var(--g)}.pill.win{background:#0f3a2a;color:var(--win)}.pill.loss{background:#43191a;color:var(--loss)}.pill.void{background:#1c2940;color:#8497b4}
.adm{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.btn{font:600 .85rem Inter;background:var(--g);color:#06101f;border:0;border-radius:12px;padding:11px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:.74rem;border-radius:8px}.btn.del{color:var(--loss)}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;display:none}
.form.open{display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
label{font-size:.72rem;font-weight:600;color:var(--mut);display:block;margin-bottom:4px}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0a1424;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--g2);outline-offset:0}
.empty,.gate{text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px}
.gate{margin-top:40px;padding:50px 24px;border-style:solid}.gate h2{color:var(--ink);font-size:1.6rem;margin:8px 0}.gate>div:first-child{color:var(--g)}
.top2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
@media(max-width:700px){.sum{grid-template-columns:1fr 1fr}.sum div:nth-child(3){border:0;padding:0}.cats{grid-template-columns:1fr}.tip{grid-template-columns:4px 1fr}.right{grid-column:2;text-align:left;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.adm{margin:0}.who{display:none}}

html{background:#050b17}
body{background:transparent;position:relative}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 15% -10%,#12335c 0%,transparent 60%),radial-gradient(900px 600px at 100% 10%,#0f2a52 0%,transparent 55%),linear-gradient(180deg,#071122,#040a15)}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:fl 18s ease-in-out infinite}
.bg i:nth-child(1){width:420px;height:420px;background:#3b8fe0;left:-120px;top:12%}
.bg i:nth-child(2){width:360px;height:360px;background:#8ecbff;right:-100px;top:45%;animation-delay:-6s;opacity:.22}
.bg i:nth-child(3){width:320px;height:320px;background:#2a5cc4;left:35%;bottom:-140px;animation-delay:-11s}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(142,203,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(142,203,255,.045) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-50px) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:200% 0}}
.bar{background:rgba(5,11,23,.7)}
.back{font-size:.85rem;font-weight:600;color:var(--g);padding:8px 14px;border:1px solid var(--line);border-radius:99px;transition:.2s}.back:hover{background:#12294a;border-color:#2b4c7a}
.brand i{background:linear-gradient(110deg,#8ecbff 30%,#fff 50%,#8ecbff 70%);background-size:200% 100%;animation:sh 3.5s linear infinite}
.hero h1{background:linear-gradient(90deg,#fff,#a9d8ff 60%,#6fb6f2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero,.sum,.cat,.top2,.tabs.sub,.form{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.sum{animation-delay:.08s;box-shadow:0 20px 60px -20px rgba(59,143,224,.45)}
.cat:nth-child(1){animation-delay:.14s}.cat:nth-child(2){animation-delay:.2s}.cat:nth-child(3){animation-delay:.26s}
.top2{animation-delay:.3s}.tabs.sub{animation-delay:.34s}
.tip{animation:up .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .25s,border-color .25s,box-shadow .25s;background:rgba(15,26,45,.78);backdrop-filter:blur(6px)}
.tip:hover{transform:translateY(-3px);border-color:#2f5688;box-shadow:0 14px 40px -18px rgba(90,169,230,.6)}
.cat{background:rgba(15,26,45,.78);transition:transform .25s,border-color .25s}.cat:hover{transform:translateY(-3px);border-color:#2f5688}
.tab,.btn{transition:.2s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.tab:hover{border-color:#2f5688}
.tip.pend .pill{animation:pu 2.2s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 0 5px rgba(142,203,255,.12)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.cats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
fieldset{border:0;padding:0;min-width:0;transition:opacity .2s}
fieldset:disabled{opacity:.38;pointer-events:none;filter:grayscale(.4)}
.lock{color:var(--g);background:#0d1d36;border:1px dashed #2b4c7a;border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:14px}
.fsep{font:700 .72rem Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--g);margin:6px 0 10px}
.pickprev{background:#0a1424;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
.hint,.opt{color:var(--mut);font-size:.78rem;font-weight:400}
.resrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rb{width:110px;padding:6px 10px;font-size:.8rem;border-radius:8px}
.rbro{font-size:.8rem;color:var(--mut)}.rbro b{color:var(--ink)}
select[hidden],input[hidden]{display:none}
</style>

<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="bar"><div><a class="brand" href="/vip">Viking<span style="color:var(--g)">GOLD</span><i>VIP</i></a><span class="sp"></span><span class="who" id="who"></span><a class="back" href="/">← Főoldal</a></div>
</div>
<main class="wrap" id="app"><div class="empty">Betöltés…</div></main>
<script type="module">
import { firebaseConfig } from '/js/firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, setPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { LEAGUES } from '/js/leagues.js';
import { mktList, mktDef, lineSuggest, buildPick, evalTip } from '/js/markets.js';

const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0'), ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const CATS = [['labdarugas', 'Labdarúgás', '⚽'], ['jegkorong', 'Jégkorong', '🏒'], ['kezilabda', 'Kézilabda', '🤾'], ['tenisz', 'Tenisz', '🎾'], ['kosarlabda', 'Kosárlabda', '🏀']];
const LAB = { pend: 'Függőben', win: 'Nyert', loss: 'Vesztett', void: 'Érvénytelen' }, NEXT = { pend: 'win', win: 'loss', loss: 'void', void: 'pend' };
const gate = (t, p, x = '') => { app.innerHTML = `<div class="gate"><div style="font-size:2rem">★</div><h2>${t}</h2><p>${p}</p>${x}</div>`; };

const auth = getAuth(initializeApp(firebaseConfig)), db = getFirestore(auth.app);
let isAdmin = false, tips = [], cat = 'all', day = 'all', ME = '', pend = false;
setPersistence(auth, browserSessionPersistence).catch(() => { }).finally(() => onAuthStateChanged(auth, init));

async function init(u) {
  if (!u) return gate('VIP Klub', 'A belépéshez jelentkezz be a fiókodba.', '<p style="margin-top:18px"><a class="btn" href="/auth?mode=login">Belépés</a></p>');
  let p = null; try { const [a, b] = await Promise.all([getDoc(doc(db, 'admins', u.uid)), getDoc(doc(db, 'users', u.uid))]); isAdmin = a.exists(); p = b.exists() ? b.data() : null; } catch (e) { }
  $('#who').textContent = (p && p.name) || u.email;
  if (!isAdmin && !(p && p.vip && !p.disabled)) return gate('Ez a rész VIP tagoknak szól', 'Kérd meg valamelyik admint, hogy adjon VIP rangot a fiókodnak.', '<p style="margin-top:18px"><a class="btn ghost" href="/elerhetosegek">Elérhetőségek</a></p>');
  ME = (p && p.name) || u.email.split('@')[0];
  onSnapshot(query(collection(db, 'vipTips'), orderBy('date', 'desc'), limit(500)), s => {
    tips = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const ae = document.activeElement;
    if (ae && ae.classList && ae.classList.contains('rb')) { pend = true; return; }   // eredmény-gépelés közben nem frissítünk
    draw();
  }, e => gate('Nem tölthető be', esc(e.code || e.message) + ' – töltsd fel a firestore.rules fájl tartalmát a Firebase Console → Firestore → Rules részbe, és nyomd meg a Publish gombot.'));
}

/* a tipp tényleges állapota: ha még "függőben", de van végeredmény / szögletszám, a rendszer magától eldönti */
const effStatus = t => { const s = t.status || 'pend'; if (s !== 'pend') return s; return ((t.result || t.corners) && evalTip(t)) || 'pend'; };
const rec = l => { const w = l.filter(t => effStatus(t) === 'win').length, x = l.filter(t => effStatus(t) === 'loss').length;
  const pr = l.reduce((s, t) => { const e = effStatus(t); return s + (e === 'win' ? (+t.odds || 1) - 1 : e === 'loss' ? -1 : 0); }, 0);
  return { w, x, rate: w + x ? Math.round(w / (w + x) * 100) : null, pr, n: l.length }; };
const fmt = n => (n > 0 ? '+' : '') + n.toFixed(2);

function draw() {
  const keep = $('#fbox') ? [...$('#fbox').childNodes] : [];   // a megnyitott űrlap ne vesszen el frissítéskor
  const R = rec(tips), today = ymd(new Date()), yest = ymd(new Date(Date.now() - 864e5));
  let list = tips.filter(t => (cat === 'all' || t.sport === cat) && (day === 'all' || (day === 'today' ? t.date === today : t.date === yest)));
  list.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  app.innerHTML = `
  <div class="hero"><small>Exkluzív tartalom</small><h1>Üdv a VIP Klubban, ${esc(ME)}</h1><p>Válogatott tippek labdarúgásban, jégkorongban, kézilabdában, teniszben és kosárlabdában – külön statisztikával, csak VIP tagoknak.</p></div>
  <div class="sum"><div><b>${R.n}</b><span>ÖSSZES TIPP</span></div><div><b>${R.w}–${R.x}</b><span>NYERT – VESZTETT</span></div><div><b>${R.rate == null ? '–' : R.rate + '%'}</b><span>TALÁLATI ARÁNY</span></div><div><b class="${R.pr >= 0 ? 'pos' : 'neg'}">${fmt(R.pr)}</b><span>PROFIT (EGYSÉG)</span></div></div>
  <div class="cats">${CATS.map(([k, n, i]) => { const r = rec(tips.filter(t => t.sport === k)); return `<div class="cat"><h3>${i} ${n}</h3><p><b>${r.rate == null ? '–' : r.rate + '%'}</b> találat · ${r.w}–${r.x} · ${fmt(r.pr)} egység</p></div>`; }).join('')}</div>
  <div class="top2"><div class="tabs" style="margin:0"><button class="tab ${cat === 'all' ? 'on' : ''}" data-c="all">Mind</button>${CATS.map(([k, n, i]) => `<button class="tab ${cat === k ? 'on' : ''}" data-c="${k}">${i} ${n}</button>`).join('')}</div>${isAdmin ? '<button class="btn" id="add">+ Új VIP tipp</button>' : ''}</div>
  <div class="tabs sub">${[['all', 'Összes nap'], ['today', 'Ma'], ['yest', 'Tegnap']].map(([k, n]) => `<button class="tab ${day === k ? 'on' : ''}" data-d="${k}">${n}</button>`).join('')}</div>
  <div id="fbox"></div>
  <div id="list">${list.length ? list.map((t, n) => card(t).replace('class="tip ', `style="animation-delay:${Math.min(n, 12) * 50 + 380}ms" class="tip `)).join('') : '<div class="empty">Nincs megjeleníthető tipp ebben a szűrésben.</div>'}</div>`;
  keep.forEach(n => $('#fbox').appendChild(n));
  if (!window._seen) { window._seen = 1; app.querySelectorAll('.sum b').forEach(el => { const m = el.textContent.match(/^([+-]?)(\d+(?:\.\d+)?)(%?)$/); if (!m) return; const to = parseFloat(m[2]), dec = m[2].includes('.') ? 2 : 0, t0 = performance.now(); const f = now => { const k = Math.min((now - t0) / 900, 1), v = to * (1 - Math.pow(1 - k, 3)); el.textContent = m[1] + v.toFixed(dec) + m[3]; if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }); }
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; draw(); });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { day = b.dataset.d; draw(); });
  if (!isAdmin) return;
  $('#add').onclick = () => { if ($('#vf')) $('#fbox').innerHTML = ''; else openForm(null); };
  app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => updateDoc(doc(db, 'vipTips', b.dataset.st), { status: NEXT[b.dataset.cur] }));
  app.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => openForm(tips.find(x => x.id === b.dataset.ed)));
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => confirm('Törlöd a tippet?') && deleteDoc(doc(db, 'vipTips', b.dataset.rm)));
  // gyors eredmény-rögzítés a kártyán: mentéskor a rendszer eldönti, hogy nyert / vesztett / érvénytelen
  app.querySelectorAll('.rb').forEach(i => {
    i.onkeydown = e => { if (e.key === 'Enter') i.blur(); };
    i.onblur = async () => {
      const t = tips.find(x => x.id === i.dataset.id), f = i.dataset.f, val = i.value.trim();
      if (t && val !== String(t[f] || '')) {
        const nt = { ...t, [f]: val }, r = evalTip(nt), upd = { [f]: val };
        if (r) upd.status = r; else if (t.mk) upd.status = 'pend';
        try { await updateDoc(doc(db, 'vipTips', t.id), upd); } catch (e) { alert('Nem sikerült: ' + (e.code || e.message)); }
      }
      if (pend) { pend = false; draw(); }
    };
  });
}

function card(t) {
  const c = CATS.find(x => x[0] === t.sport) || CATS[0], s = effStatus(t), isCor = t.mk === 'cor' || t.mk === 'corw';
  const inp = (f, val, ph, lab) => `<input class="rb" data-id="${t.id}" data-f="${f}" value="${esc(val || '')}" placeholder="${ph}" maxlength="30" aria-label="${lab}">`;
  const ro = (val, lab) => val ? `<span class="rbro">${lab}: <b>${esc(val)}</b></span>` : '';
  return `<div class="tip ${s}"><div class="st"></div><div><div class="meta">${c[2]} ${c[1].toUpperCase()}${t.league ? ' · ' + esc(t.league) : ''} · ${esc(t.date)}${t.time ? ' ' + esc(t.time) : ''}</div>
  <div class="match">${esc(t.home)}${t.away ? ' – ' + esc(t.away) : ''}</div><div class="pick">Tipp: <b>${esc(t.pick)}</b></div>${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
  ${isAdmin ? `<div class="resrow">${inp('result', t.result, '3-2', 'Végeredmény')}${t.sport === 'labdarugas' ? inp('corners', t.corners, isCor ? '5-6 vagy 11' : 'szöglet', 'Szögletek') : ''}</div>` : (t.result || t.corners ? `<div class="resrow">${ro(t.result, 'Végeredmény')}${ro(t.corners, 'Szöglet')}</div>` : '')}</div>
  <div class="right">${t.odds ? `<div class="odd">${(+t.odds).toFixed(2)}</div>` : ''}<span class="pill ${s}">${LAB[s]}</span>
  ${isAdmin ? `<div class="adm"><button class="btn sm ghost" data-st="${t.id}" data-cur="${s}">Állapot ›</button><button class="btn sm ghost" data-ed="${t.id}">Szerk.</button><button class="btn sm ghost del" data-rm="${t.id}">✕</button></div>` : ''}</div></div>`;
}

/* ---------- új / szerkesztett tipp: 1. sportág → 2. liga (kötelező) → utána minden más ---------- */
function openForm(t) {
  const f = t || { sport: cat === 'all' ? 'labdarugas' : cat, date: ymd(new Date()), status: 'pend' };
  const v = k => esc(f[k] ?? '');
  $('#fbox').innerHTML = `<div class="form open" id="vf"><h3 style="margin-bottom:12px">${t ? 'Tipp szerkesztése' : 'Új VIP tipp'}</h3>
  <div class="fg"><div><label>1. Sportág</label><select id="f_sport">${CATS.map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select></div>
  <div><label>2. Liga / bajnokság <b style="color:var(--loss)">*</b></label><select id="f_league"></select></div>
  <div id="f_lgbox" hidden><label>Saját liga neve</label><input id="f_lgcustom" maxlength="60"></div></div>
  <p class="lock" id="f_lock">🔒 Először válaszd ki a ligát – addig a csapatok és a többi mező zárolva van.</p>
  <fieldset id="rest" disabled>
    <div class="fg"><div><label>Dátum</label><input type="date" id="f_date" value="${v('date')}"></div><div><label>Időpont <span class="opt">(opc.)</span></label><input type="time" id="f_time" value="${v('time')}"></div></div>
    <div class="fg"><div><label>Hazai csapat / játékos</label><select id="f_hs"></select><input id="f_h" maxlength="60" placeholder="Írd be a nevét" hidden></div>
    <div><label>Vendég csapat / játékos</label><select id="f_as"></select><input id="f_a" maxlength="60" placeholder="Írd be a nevét" hidden></div></div>
    <div class="fsep">Fő tipp</div>
    <div class="fg"><div><label>Piac</label><select id="f_mk"></select></div><div id="f_sdbox"><label>Kimenet</label><select id="f_sd"></select></div><div id="f_lnbox"><label>Vonal <span class="opt" id="f_lnhint"></span></label><input id="f_ln" list="dlLines" inputmode="decimal" placeholder="pl. 2.5"></div><div id="f_frbox" hidden style="grid-column:span 2"><label>Tipp szövege</label><input id="f_free" maxlength="80"></div></div>
    <datalist id="dlLines"></datalist><div class="pickprev" id="f_prev"></div>
    <div class="fg"><div><label>Odds <span class="opt">(opc.)</span></label><input id="f_odds" type="number" step="0.01" min="1" value="${v('odds')}"></div>
    <div><label>Végeredmény <span class="opt">(opc.)</span></label><input id="f_result" maxlength="30" placeholder="3-2" value="${v('result')}"></div>
    <div id="f_cobox" hidden><label>Szögletek <span class="opt">(hazai-vendég, pl. 5-6)</span></label><input id="f_corners" maxlength="20" placeholder="5-6 vagy összesen 11" value="${v('corners')}"></div>
    <div><label>Állapot</label><select id="f_status">${Object.entries(LAB).map(([k, n]) => `<option value="${k}" ${(f.status || 'pend') === k ? 'selected' : ''}>${k === 'pend' ? 'Automatikus (az eredményből)' : n + ' (kézi)'}</option>`).join('')}</select></div></div>
    <div style="margin-bottom:12px"><label>Megjegyzés <span class="opt">(opc.)</span></label><input id="f_note" maxlength="200" value="${v('note')}"></div>
    <p class="hint">Ha megadod a végeredményt (és szögletes tippnél a szögleteket), a nyert / vesztett / érvénytelen állapotot a rendszer magától kiszámolja. Később a tipp kártyáján is beírhatod az eredményt. Jégkorongnál hosszabbítás / szétlövés: 4-3 ot vagy 3-2 so. Tenisznél szettek: 2-1 vagy 6-4 3-6 7-5.</p>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="save">Mentés</button><button class="btn ghost" id="cancel">Mégse</button></div>
  </fieldset></div>`;
  const E = id => $('#' + id), sport = () => E('f_sport').value, ls = () => LEAGUES[sport()] || [];
  const curLg = () => ls().find(l => l.n === E('f_league').value);
  const lgOk = () => { const x = E('f_league').value; return !!x && (x !== '__x' || !!E('f_lgcustom').value.trim()); };
  const lock = () => { const ok = lgOk(); E('rest').disabled = !ok; E('f_lock').hidden = ok; };
  function fillLeagues(cur) {
    E('f_league').innerHTML = '<option value="">– válassz ligát –</option>' + ls().map(l => `<option>${esc(l.n)}</option>`).join('') + '<option value="__x">Egyéb (saját)…</option>';
    let val = '', custom = ''; if (cur) { if (ls().some(l => l.n === cur)) val = cur; else { val = '__x'; custom = cur; } }
    E('f_league').value = val; E('f_lgcustom').value = custom; E('f_lgbox').hidden = val !== '__x'; lock();
  }
  function fillTeams(keep) {   // a csapatlista a kiválasztott ligához tartozik
    const lg = curLg(), teams = lg ? lg.t : [];
    [['h', E('f_hs'), E('f_h')], ['a', E('f_as'), E('f_a')]].forEach(([, sel, inp]) => {
      if (!keep) inp.value = '';
      const cur = inp.value;
      if (teams.length) {
        sel.hidden = false;
        sel.innerHTML = '<option value="">– válassz csapatot –</option>' + teams.map(x => `<option>${esc(x)}</option>`).join('') + '<option value="__x">Egyéb (saját)…</option>';
        sel.value = cur ? (teams.includes(cur) ? cur : '__x') : '';
        inp.hidden = sel.value !== '__x';
      } else { sel.hidden = true; inp.hidden = false; }
    });
    prev();
  }
  function fillMarkets(curMk) {
    const ms = mktList(sport(), true);
    E('f_mk').innerHTML = ms.map(m => `<option value="${m.k}">${esc(m.l)}</option>`).join('');
    if (curMk && ms.some(m => m.k === curMk)) E('f_mk').value = curMk;
    fillMarket();
  }
  function fillMarket(curSd, curLn) {
    const m = mktDef(sport(), E('f_mk').value);
    E('f_sd').innerHTML = m.s.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('');
    if (curSd && m.s.some(x => x[0] === curSd)) E('f_sd').value = curSd;
    E('f_sdbox').hidden = !!m.free; E('f_frbox').hidden = !m.free; E('f_lnbox').hidden = !m.line;
    E('f_cobox').hidden = !(m.k === 'cor' || m.k === 'corw') && !E('f_corners').value;
    if (m.line) { E('f_lnhint').textContent = m.line === 'signed' ? '(− vagy + is lehet)' : ''; E('dlLines').innerHTML = lineSuggest(sport(), m.k).map(x => `<option value="${x}">`).join(''); E('f_ln').value = curLn != null ? curLn : ''; }
    prev();
  }
  const readLn = () => { const n = parseFloat(String(E('f_ln').value).replace(',', '.').replace('−', '-')); return isNaN(n) ? null : n; };
  function curPick() {
    const m = mktDef(sport(), E('f_mk').value);
    if (m.free) return E('f_free').value.trim();
    if (m.line && readLn() == null) return '';
    return buildPick({ sport: sport(), mk: m.k, sd: E('f_sd').value, ln: readLn(), home: E('f_h').value, away: E('f_a').value });
  }
  function prev() { const p = curPick(); E('f_prev').innerHTML = p ? `Tipp: <b>${esc(p)}</b>` : '<span style="color:var(--mut);font-size:.8rem">Válaszd ki a fő tippet…</span>'; }

  // kezdőállapot
  E('f_sport').value = f.sport && CATS.some(c => c[0] === f.sport) ? f.sport : 'labdarugas';
  fillLeagues(f.league || ''); E('f_h').value = f.home || ''; E('f_a').value = f.away || ''; fillTeams(true);
  const hasMk = !!f.mk; fillMarkets(hasMk ? f.mk : (t ? 'free' : ''));
  if (hasMk) fillMarket(f.sd, f.ln); else if (t) E('f_free').value = f.pick || '';
  prev();

  E('f_sport').onchange = () => { fillLeagues(''); fillTeams(false); fillMarkets(''); };
  E('f_league').onchange = () => { E('f_lgbox').hidden = E('f_league').value !== '__x'; lock(); fillTeams(false); };
  E('f_lgcustom').oninput = lock;
  [['f_hs', 'f_h'], ['f_as', 'f_a']].forEach(([s, i]) => E(s).onchange = () => { const sel = E(s), inp = E(i); if (sel.value === '__x') { inp.hidden = false; inp.value = ''; inp.focus(); } else { inp.hidden = true; inp.value = sel.value; } prev(); });
  E('f_mk').onchange = () => fillMarket();
  ['f_sd', 'f_ln', 'f_h', 'f_a', 'f_free'].forEach(id => { E(id).oninput = prev; E(id).onchange = prev; });
  $('#vf').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('#cancel').onclick = () => { $('#fbox').innerHTML = ''; };
  $('#save').onclick = async () => {
    if (!lgOk()) return alert('Először válaszd ki a ligát.');
    const m = mktDef(sport(), E('f_mk').value), ln = readLn(), pick = curPick(), g = id => E(id).value.trim();
    if (!E('f_date').value || !g('f_h') || !g('f_a')) return alert('A dátum, a hazai és a vendég csapat kötelező.');
    if (g('f_h').toLowerCase() === g('f_a').toLowerCase()) return alert('A két csapat nem lehet ugyanaz.');
    if (m.line && ln == null) return alert('Add meg a vonalat (pl. 2.5 vagy -1.5).');
    if (!pick) return alert('Add meg a fő tippet.');
    const lgSel = E('f_league').value, odds = parseFloat(g('f_odds').replace(',', '.'));
    const row = { sport: sport(), date: E('f_date').value, time: g('f_time'), league: lgSel === '__x' ? g('f_lgcustom') : lgSel, home: g('f_h'), away: g('f_a'), mk: m.free ? '' : m.k, sd: m.free ? '' : E('f_sd').value, ln: m.line ? ln : null, pick, odds: odds > 1 ? Math.round(odds * 100) / 100 : 0, note: g('f_note'), result: g('f_result'), corners: g('f_corners'), status: E('f_status').value };
    if (row.result || row.corners) { const r = evalTip(row); if (r) row.status = r; }
    $('#save').disabled = true;
    try {
      if (t) await updateDoc(doc(db, 'vipTips', t.id), row); else await addDoc(collection(db, 'vipTips'), { ...row, status: row.status || 'pend', created: Date.now() });
      $('#fbox').innerHTML = '';
    } catch (e) { alert('Nem sikerült: ' + (e.code || e.message)); $('#save').disabled = false; }
  };
}
</script>
</body>
</html>
