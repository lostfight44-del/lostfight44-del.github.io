<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="bar"><div><a class="brand" href="/vip">Viking<span style="color:var(--g)">GOLD</span><i>VIP</i></a><small class="vc" id="vipc" hidden></small><span class="sp"></span><span class="who" id="who"></span><a class="back" href="/">← Főoldal</a></div>
</div>
<main class="wrap" id="app"><div class="empty">Betöltés…</div></main>
<script type="module">
import { firebaseConfig } from '/js/firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, setPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { LEAGUES } from '/js/leagues.js';
import { mktList, mktDef, lineSuggest, buildPick, evalTip } from '/js/markets.js';

const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0'), ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const CATS = [['labdarugas', 'Labdarúgás', '⚽'], ['jegkorong', 'Jégkorong', '🏒'], ['kezilabda', 'Kézilabda', '🤾']];   // VIP: csak foci, korong, kézi
const VIPK = CATS.map(c => c[0]);
const LAB = { pend: 'Függőben', win: 'Nyert', loss: 'Vesztett', void: 'Érvénytelen' }, NEXT = { pend: 'win', win: 'loss', loss: 'void', void: 'pend' };
const gate = (t, p, x = '') => { app.innerHTML = `<div class="gate"><div style="font-size:2rem">★</div><h2>${t}</h2><p>${p}</p>${x}</div>`; };

const auth = getAuth(initializeApp(firebaseConfig)), db = getFirestore(auth.app);
let isAdmin = false, TPS = [], tips = [], cat = 'all', day = 'all', ME = '', pend = false;
const KNOWN_TP = ['_Notryn', 'Kriszhhh'];   // egységes írásmód: a „_notryn” és az „_Notryn” ugyanaz a személy
const tpN = n => { const k = String(n == null ? '' : n).toLowerCase(); return KNOWN_TP.find(a => a.toLowerCase() === k) || n; };
setPersistence(auth, browserSessionPersistence).catch(() => { }).finally(() => onAuthStateChanged(auth, init));

async function init(u) {
  if (!u) return gate('VIP Klub', 'A belépéshez jelentkezz be a fiókodba.', '<p style="margin-top:18px"><a class="btn" href="/auth?mode=login">Belépés</a></p>');
  let p = null; try { const [a, b] = await Promise.all([getDoc(doc(db, 'admins', u.uid)), getDoc(doc(db, 'users', u.uid))]); isAdmin = a.exists(); p = b.exists() ? b.data() : null; } catch (e) { }
  $('#who').textContent = (p && p.name) || u.email;
  if (!isAdmin && !(p && p.vip && !p.disabled)) return gate('Ez a rész VIP tagoknak szól', 'Kérd meg valamelyik admint, hogy adjon VIP rangot a fiókodnak.', '<p style="margin-top:18px"><a class="btn ghost" href="/elerhetosegek">Elérhetőségek</a></p>');
  ME = (p && p.name) || u.email.split('@')[0];
  if (isAdmin) try { TPS = (await getDocs(collection(db, 'admins'))).docs.map(d => d.data().name).filter(Boolean); } catch (e) { }
  onSnapshot(collection(db, 'users'), sn => { const n = sn.docs.filter(d => { const x = d.data(); return x.vip && !x.disabled; }).length, el = $('#vipc'); el.innerHTML = '· <b>' + n + '</b> vip tag'; el.hidden = false; }, () => { });
  onSnapshot(query(collection(db, 'vipTips'), orderBy('date', 'desc'), limit(500)), s => {
    tips = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => VIPK.includes(t.sport));
    const ae = document.activeElement;
    if (ae && ae.classList && ae.classList.contains('rb')) { pend = true; return; }   // eredmény-gépelés közben nem frissítünk
    draw();
  }, e => gate('Nem tölthető be', esc(e.code || e.message) + ' – töltsd fel a firestore.rules fájl tartalmát a Firebase Console → Firestore → Rules részbe, és nyomd meg a Publish gombot.'));
}

/* a tipp tényleges állapota: ha még "függőben", de van végeredmény / szögletszám, a rendszer magától eldönti */
const effStatus = t => { const s = t.status || 'pend'; if (s !== 'pend') return s; return ((t.result || t.corners) && evalTip(t)) || 'pend'; };
const rec = l => { const w = l.filter(t => effStatus(t) === 'win').length, x = l.filter(t => effStatus(t) === 'loss').length;
  const pr = l.reduce((s, t) => { const e = effStatus(t); return s + (e === 'win' ? (+t.odds || 1) - 1 : e === 'loss' ? -1 : 0); }, 0);
  return { w, x, rate: w + x ? Math.round(w / (w + x) * 100) : null, pr, n: l.length }; };
const fmt = n => (n > 0 ? '+' : '') + n.toFixed(2);

/* vonaldiagram: napról napra összesített eltalált / nem talált tippek + találati arány */
function chart(list) {
  const days = {}; list.forEach(t => { const s = effStatus(t); if (s !== 'win' && s !== 'loss') return; (days[t.date] = days[t.date] || { w: 0, x: 0 })[s === 'win' ? 'w' : 'x']++; });
  const ds = Object.keys(days).sort(); if (!ds.length) return '<div class="nodata">Még nincs lezárt tipp – amint lesz eredmény, itt jelenik meg a görbe.</div>';
  let W = 0, X = 0; const P = ds.map(d => { W += days[d].w; X += days[d].x; return { d, W, X, r: Math.round(W / (W + X) * 100) }; });
  const w = 640, h = 230, L = 34, R = 36, T = 12, B = 28, mx = Math.max(4, ...P.map(p => Math.max(p.W, p.X)));
  const nx = i => P.length < 2 ? (L + w - R) / 2 : L + i * (w - L - R) / (P.length - 1), yc = n => h - B - n / mx * (h - B - T), yp = r => h - B - r / 100 * (h - B - T);
  const path = (f, y) => P.map((p, i) => (i ? 'L' : 'M') + nx(i).toFixed(1) + ' ' + y(f(p)).toFixed(1)).join(' ');
  const dots = (f, y, c, u) => P.map((p, i) => `<circle cx="${nx(i).toFixed(1)}" cy="${y(f(p)).toFixed(1)}" r="3.6" fill="${c}"><title>${p.d}: ${f(p)}${u}</title></circle>`).join('');
  const grid = [0, .25, .5, .75, 1].map(k => `<line class="gd" x1="${L}" x2="${w - R}" y1="${(h - B - k * (h - B - T)).toFixed(1)}" y2="${(h - B - k * (h - B - T)).toFixed(1)}"/><text class="ax" x="${L - 6}" y="${(h - B - k * (h - B - T) + 3).toFixed(1)}" text-anchor="end">${Math.round(mx * k)}</text><text class="ax" x="${w - R + 6}" y="${(h - B - k * (h - B - T) + 3).toFixed(1)}">${k * 100}%</text>`).join('');
  const step = Math.ceil(P.length / 7), xl = P.map((p, i) => i % step === 0 || i === P.length - 1 ? `<text class="ax" x="${nx(i).toFixed(1)}" y="${h - 8}" text-anchor="middle">${p.d.slice(5).replace('-', '.')}.</text>` : '').join('');
  const last = P[P.length - 1];
  return `<div class="lg"><span><i style="background:#4ade9a"></i>Eltalált (db)</span><span><i style="background:#ff7b6b"></i>Nem talált (db)</span><span><i style="background:#8bddff"></i>Találati arány (%) – most <b style="color:#d5f2ff">${last.r}%</b></span></div>
  <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Eltalált tippek alakulása">${grid}${xl}
  <path d="${path(p => p.X, yc)}" fill="none" stroke="#ff7b6b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="${path(p => p.W, yc)}" fill="none" stroke="#4ade9a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="${path(p => p.r, yp)}" fill="none" stroke="#8bddff" stroke-width="2.4" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/>
  ${dots(p => p.X, yc, '#ff7b6b', ' nem talált összesen')}${dots(p => p.W, yc, '#4ade9a', ' eltalált összesen')}${dots(p => p.r, yp, '#8bddff', '% találati arány')}</svg>`;
}

function draw() {
  const keep = $('#fbox') ? [...$('#fbox').childNodes] : [];   // a megnyitott űrlap ne vesszen el frissítéskor
  const R = rec(tips), today = ymd(new Date()), yest = ymd(new Date(Date.now() - 864e5));
  let list = tips.filter(t => (cat === 'all' || t.sport === cat) && (day === 'all' || (day === 'today' ? t.date === today : t.date === yest)));
  list.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  app.innerHTML = `
  <div class="hero"><small>Exkluzív tartalom</small><h1>Üdv a VIP Klubban, ${esc(ME)}</h1><p>Válogatott tippek labdarúgásban, jégkorongban és kézilabdában – külön statisztikával, csak VIP tagoknak.</p></div>
  <div class="sum"><div><b>${R.n}</b><span>ÖSSZES TIPP</span></div><div><b>${R.w}–${R.x}</b><span>NYERT – VESZTETT</span></div><div><b>${R.rate == null ? '–' : R.rate + '%'}</b><span>TALÁLATI ARÁNY</span></div><div><b class="${R.pr >= 0 ? 'pos' : 'neg'}">${fmt(R.pr)}</b><span>PROFIT (EGYSÉG)</span></div></div>
  <div class="cats">${CATS.map(([k, n, i]) => { const r = rec(tips.filter(t => t.sport === k)); return `<div class="cat"><h3>${i} ${n}</h3><p><b>${r.rate == null ? '–' : r.rate + '%'}</b> találat · ${r.w}–${r.x} · ${fmt(r.pr)} egység</p></div>`; }).join('')}</div>
  <div class="chart"><h3>Eltalált tippek alakulása</h3>${chart(tips.filter(t => cat === 'all' || t.sport === cat))}</div>
  <div class="top2"><div class="tabs" style="margin:0"><button class="tab ${cat === 'all' ? 'on' : ''}" data-c="all">Mind</button>${CATS.map(([k, n, i]) => `<button class="tab ${cat === k ? 'on' : ''}" data-c="${k}">${i} ${n}</button>`).join('')}</div>${isAdmin ? '<button class="btn" id="add">+ Új VIP tipp</button>' : ''}</div>
  <div class="tabs sub">${[['all', 'Összes nap'], ['today', 'Ma'], ['yest', 'Tegnap']].map(([k, n]) => `<button class="tab ${day === k ? 'on' : ''}" data-d="${k}">${n}</button>`).join('')}</div>
  <div id="fbox"></div>
  <div id="list">${list.length ? list.map((t, n) => card(t).replace('class="tip ', `style="animation-delay:${Math.min(n, 12) * 50 + 380}ms" class="tip `)).join('') : '<div class="empty">Nincs megjeleníthető tipp ebben a szűrésben.</div>'}</div>`;
  keep.forEach(n => $('#fbox').appendChild(n));
  if (!window._seen) { window._seen = 1; app.querySelectorAll('.sum b').forEach(el => { const m = el.textContent.match(/^([+-]?)(\d+(?:\.\d+)?)(%?)$/); if (!m) return; const to = parseFloat(m[2]), dec = m[2].includes('.') ? 2 : 0, t0 = performance.now(); const f = now => { const k = Math.min((now - t0) / 900, 1), v = to * (1 - Math.pow(1 - k, 3)); el.textContent = m[1] + v.toFixed(dec) + m[3]; if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }); }
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; draw(); });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { day = b.dataset.d; draw(); });
  if (!isAdmin) return;
  $('#add').onclick = () => { if ($('#vf')) $('#fbox').innerHTML = ''; else openForm(null); };
  app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => updateDoc(doc(db, 'vipTips', b.dataset.st), { status: NEXT[b.dataset.cur] }));
  app.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => openForm(tips.find(x => x.id === b.dataset.ed)));
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => confirm('Törlöd a tippet?') && deleteDoc(doc(db, 'vipTips', b.dataset.rm)));
  // gyors eredmény-rögzítés a kártyán: mentéskor a rendszer eldönti, hogy nyert / vesztett / érvénytelen
  app.querySelectorAll('.rb').forEach(i => {
    i.onkeydown = e => { if (e.key === 'Enter') i.blur(); };
    i.onblur = async () => {
      const t = tips.find(x => x.id === i.dataset.id), f = i.dataset.f, val = i.value.trim();
      if (t && val !== String(t[f] || '')) {
        const nt = { ...t, [f]: val }, r = evalTip(nt), upd = { [f]: val };
        if (r) upd.status = r; else if (t.mk) upd.status = 'pend';
        try { await updateDoc(doc(db, 'vipTips', t.id), upd); } catch (e) { alert('Nem sikerült: ' + (e.code || e.message)); }
      }
      if (pend) { pend = false; draw(); }
    };
  });
}

function card(t) {
  const c = CATS.find(x => x[0] === t.sport) || CATS[0], s = effStatus(t), isCor = t.mk === 'cor' || t.mk === 'corw';
  const inp = (f, val, ph, lab) => `<input class="rb" data-id="${t.id}" data-f="${f}" value="${esc(val || '')}" placeholder="${ph}" maxlength="30" aria-label="${lab}">`;
  const ro = (val, lab) => val ? `<span class="rbro">${lab}: <b>${esc(val)}</b></span>` : '';
  return `<div class="tip ${s}"><div class="st"></div><div><div class="meta">${c[2]} ${c[1].toUpperCase()}${t.league ? ' · ' + esc(t.league) : ''} · ${esc(t.date)}${t.time ? ' ' + esc(t.time) : ''}</div>
  <div class="match">${esc(t.home)}${t.away ? ' – ' + esc(t.away) : ''}</div><div class="pick">Tipp: <b>${esc(t.pick)}</b> · Tippadó: <b>${esc(tpN(t.tipster) || 'Admin')}</b></div>${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
  ${isAdmin ? `<div class="resrow">${inp('result', t.result, '3-2', 'Végeredmény')}${t.sport === 'labdarugas' && isCor ? inp('corners', t.corners, '5-6 vagy 11', 'Szögletek (csak a kiértékeléshez)') : ''}</div>` : (t.result ? `<div class="resrow">${ro(t.result, 'Végeredmény')}</div>` : '')}</div>
  <div class="right">${t.odds ? `<div class="odd">${(+t.odds).toFixed(2)}</div>` : ''}<span class="pill ${s}">${LAB[s]}</span>
  ${isAdmin ? `<div class="adm"><button class="btn sm ghost" data-st="${t.id}" data-cur="${s}">Állapot ›</button><button class="btn sm ghost" data-ed="${t.id}">Szerk.</button><button class="btn sm ghost del" data-rm="${t.id}">✕</button></div>` : ''}</div></div>`;
}

/* ---------- új / szerkesztett tipp: 1. sportág → 2. liga (kötelező) → utána minden más ---------- */
function openForm(t) {
  const f = t || { sport: cat === 'all' ? 'labdarugas' : cat, date: ymd(new Date()), status: 'pend' };
  const v = k => esc(f[k] ?? '');
  $('#fbox').innerHTML = `<div class="form open" id="vf"><h3 style="margin-bottom:12px">${t ? 'Tipp szerkesztése' : 'Új VIP tipp'}</h3>
  <div class="fg"><div><label>1. Sportág</label><select id="f_sport">${CATS.map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select></div>
  <div><label>2. Liga / bajnokság <b style="color:var(--loss)">*</b></label><input id="f_league" list="dlLg" placeholder="Válassz a listából, vagy írd be a ligát" autocomplete="off"><datalist id="dlLg"></datalist></div></div>
  <div class="fg"><div><label>3. Hazai csapat</label><input id="f_h" list="dlH" placeholder="Válassz vagy írd be a hazai csapatot" autocomplete="off" disabled><datalist id="dlH"></datalist></div>
  <div><label>4. Vendég csapat</label><input id="f_a" list="dlA" placeholder="Válassz vagy írd be a vendég csapatot" autocomplete="off" disabled><datalist id="dlA"></datalist></div></div>
  <p class="lock" id="f_lock"></p>
  <fieldset id="rest" disabled>
    <div class="fg"><div><label>Dátum</label><input type="date" id="f_date" value="${v('date')}"></div><div><label>Időpont <span class="opt">(opc.)</span></label><input type="time" id="f_time" value="${v('time')}"></div></div>
    <div class="fsep">Fő tipp</div>
    <div class="fg"><div><label>Piac</label><select id="f_mk"></select></div><div id="f_sdbox"><label>Kimenet</label><select id="f_sd"></select></div><div id="f_lnbox"><label>Vonal <span class="opt" id="f_lnhint"></span></label><input id="f_ln" list="dlLines" inputmode="decimal" placeholder="pl. 2.5"></div><div id="f_frbox" hidden style="grid-column:span 2"><label>Tipp szövege</label><input id="f_free" maxlength="80"></div></div>
    <datalist id="dlLines"></datalist><div class="pickprev" id="f_prev"></div>
    <div class="fg"><div><label>Odds <span class="opt">(opc.)</span></label><input id="f_odds" type="number" step="0.01" min="1" value="${v('odds')}"></div>
    <div><label>Végeredmény <span class="opt">(opc.)</span></label><input id="f_result" maxlength="30" placeholder="3-2" value="${v('result')}"></div>
    <div id="f_cobox" hidden><label>Szögletek <span class="opt">(hazai-vendég, pl. 5-6)</span></label><input id="f_corners" maxlength="20" placeholder="5-6 vagy összesen 11" value="${v('corners')}"></div>
    <div><label>Tippadó</label><select id="f_tipster">${[...new Set([...(f.tipster ? [f.tipster] : []), ME, ...TPS].map(tpN))].map(n => `<option ${tpN(f.tipster || ME) === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
    <div><label>Állapot</label><select id="f_status">${Object.entries(LAB).map(([k, n]) => `<option value="${k}" ${(f.status || 'pend') === k ? 'selected' : ''}>${k === 'pend' ? 'Automatikus (az eredményből)' : n + ' (kézi)'}</option>`).join('')}</select></div></div>
    <div style="margin-bottom:12px"><label>Megjegyzés <span class="opt">(opc.)</span></label><input id="f_note" maxlength="200" value="${v('note')}"></div>
    <p class="hint">Ha megadod a végeredményt (és szögletes tippnél a szögleteket), a nyert / vesztett / érvénytelen állapotot a rendszer magától kiszámolja. Később a tipp kártyáján is beírhatod az eredményt. Jégkorongnál hosszabbítás / szétlövés: 4-3 ot vagy 3-2 so. Tenisznél szettek: 2-1 vagy 6-4 3-6 7-5.</p>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="save">Mentés</button><button class="btn ghost" id="cancel">Mégse</button></div>
  </fieldset></div>`;
  const E = id => $('#' + id), sport = () => E('f_sport').value, ls = () => LEAGUES[sport()] || [];
  const leaguesOf = ls;
    const stage = () => { const l = !!E('f_league').value.trim(), h = l && !!E('f_h').value.trim(), a = h && !!E('f_a').value.trim();
      E('f_h').disabled = !l; E('f_a').disabled = !h; E('rest').disabled = !a;
      const lk = E('f_lock'); lk.hidden = a; lk.textContent = !l ? '🔒 Először válaszd ki a ligát.' : !h ? '🔒 Most a hazai csapatot válaszd ki.' : '🔒 Most a vendég csapatot válaszd ki.'; };
    const curLg = () => leaguesOf().find(l => l.n === E('f_league').value);
    function fillTeams(keep) {   // csak a kiválasztott liga csapatai; a már kiválasztott csapat a másik listából kimarad
      if (!keep) { E('f_h').value = ''; E('f_a').value = ''; }
      const lg = curLg(), base = lg ? lg.t.slice() : [], hv = E('f_h').value, av = E('f_a').value;
      [hv, av].forEach(x => { if (x && !base.includes(x)) base.push(x); });   // régi, listán kívüli név se vesszen el szerkesztéskor
      const mk = ex => base.filter(x => x !== ex).map(x => `<option value="${esc(x)}">`).join('');
      E('dlH').innerHTML = mk(av); E('dlA').innerHTML = mk(hv);
      stage(); if (typeof prev === 'function') prev();
    }
    function fillLeagues(cur) {
      const ls = leaguesOf(), list = ls.map(l => l.n);
      E('dlLg').innerHTML = list.map(n => `<option value="${esc(n)}">`).join('');
      E('f_league').value = cur || ''; stage();
    }
  function fillMarkets(curMk) {
    const ms = mktList(sport(), true);
    E('f_mk').innerHTML = ms.map(m => `<option value="${m.k}">${esc(m.l)}</option>`).join('');
    if (curMk && ms.some(m => m.k === curMk)) E('f_mk').value = curMk;
    fillMarket();
  }
  function fillMarket(curSd, curLn) {
    const m = mktDef(sport(), E('f_mk').value);
    E('f_sd').innerHTML = m.s.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('');
    if (curSd && m.s.some(x => x[0] === curSd)) E('f_sd').value = curSd;
    E('f_sdbox').hidden = !!m.free; E('f_frbox').hidden = !m.free; E('f_lnbox').hidden = !m.line;
    E('f_cobox').hidden = !(m.k === 'cor' || m.k === 'corw') && !E('f_corners').value;
    if (m.line) { E('f_lnhint').textContent = m.line === 'signed' ? '(− vagy + is lehet)' : ''; E('dlLines').innerHTML = lineSuggest(sport(), m.k).map(x => `<option value="${x}">`).join(''); E('f_ln').value = curLn != null ? curLn : ''; }
    prev();
  }
  const readLn = () => { const n = parseFloat(String(E('f_ln').value).replace(',', '.').replace('−', '-')); return isNaN(n) ? null : n; };
  function curPick() {
    const m = mktDef(sport(), E('f_mk').value);
    if (!m) return '';
    if (m.free) return E('f_free').value.trim();
    if (m.line && readLn() == null) return '';
    return buildPick({ sport: sport(), mk: m.k, sd: E('f_sd').value, ln: readLn(), home: E('f_h').value, away: E('f_a').value });
  }
  function prev() { const p = curPick(); E('f_prev').innerHTML = p ? `Tipp: <b>${esc(p)}</b>` : '<span style="color:var(--mut);font-size:.8rem">Válaszd ki a fő tippet…</span>'; }

  // kezdőállapot
  E('f_sport').value = f.sport && CATS.some(c => c[0] === f.sport) ? f.sport : 'labdarugas';
  fillLeagues(f.league || ''); E('f_h').value = f.home || ''; E('f_a').value = f.away || ''; fillTeams(true);
  const hasMk = !!f.mk; fillMarkets(hasMk ? f.mk : (t ? 'free' : ''));
  if (hasMk) fillMarket(f.sd, f.ln); else if (t) E('f_free').value = f.pick || '';
  prev();

  E('f_sport').onchange = () => { fillLeagues(''); fillTeams(false); fillMarkets(''); };
  E('f_league').oninput = () => fillTeams(true);
  E('f_league').onchange = () => { const lg = curLg(); if (lg && lg.t.length) ['f_h', 'f_a'].forEach(i => { if (E(i).value && !lg.t.includes(E(i).value)) E(i).value = ''; }); fillTeams(true); };
  ['f_h', 'f_a'].forEach(i => { E(i).oninput = () => fillTeams(true); E(i).onchange = () => fillTeams(true); });
  E('f_mk').onchange = () => fillMarket();
  ['f_sd', 'f_ln', 'f_free'].forEach(id => { E(id).oninput = prev; E(id).onchange = prev; });
  $('#vf').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('#cancel').onclick = () => { $('#fbox').innerHTML = ''; };
  $('#save').onclick = async () => {
    if (!E('f_league').value.trim()) return alert('Add meg a ligát.');
    const m = mktDef(sport(), E('f_mk').value), ln = readLn(), pick = curPick(), g = id => E(id).value.trim();
    if (!E('f_date').value || !g('f_h') || !g('f_a')) return alert('A dátum, a hazai és a vendég csapat kötelező.');
    if (g('f_h').toLowerCase() === g('f_a').toLowerCase()) return alert('A két csapat nem lehet ugyanaz.');
    if (m.line && ln == null) return alert('Add meg a vonalat (pl. 2.5 vagy -1.5).');
    if (!pick) return alert('Add meg a fő tippet.');
    const lgSel = E('f_league').value.trim(), odds = parseFloat(g('f_odds').replace(',', '.'));
    const row = { sport: sport(), date: E('f_date').value, time: g('f_time'), league: lgSel, home: g('f_h'), away: g('f_a'), mk: m.free ? '' : m.k, sd: m.free ? '' : E('f_sd').value, ln: m.line ? ln : null, pick, odds: odds > 1 ? Math.round(odds * 100) / 100 : 0, note: g('f_note'), result: g('f_result'), corners: g('f_corners'), tipster: g('f_tipster'), status: E('f_status').value };
    if (row.result || row.corners) { const r = evalTip(row); if (r) row.status = r; }
    $('#save').disabled = true;
    try {
      if (t) await updateDoc(doc(db, 'vipTips', t.id), row); else await addDoc(collection(db, 'vipTips'), { ...row, status: row.status || 'pend', created: Date.now() });
      $('#fbox').innerHTML = '';
    } catch (e) { alert('Nem sikerült: ' + (e.code || e.message)); $('#save').disabled = false; }
  };
}
</script>
</body>
</html>
