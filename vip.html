<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>VIP Klub | VikingGOLD</title>
<script>if(/\.html$/.test(location.pathname))history.replaceState(null,"",location.pathname.replace(/\.html$/,"")+location.search+location.hash)</script>
<link rel="icon" href="/assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#16211c;--mut:#6b7a72;--line:#e5e0d3;--g:#0e3b2c;--g2:#165a43;--au:#a8812f;--win:#17804f;--loss:#c0392b;--r:16px}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 20px 12px}
.bar>div{max-width:980px;margin:auto;display:flex;align-items:center;gap:14px}
.brand{font:700 1.25rem Fraunces,serif;display:flex;align-items:center;gap:10px}
.brand i{font-style:normal;font:700 .68rem Inter;letter-spacing:.14em;color:#fff;background:var(--g);padding:4px 9px;border-radius:99px}
.sp{flex:1}.who{font-size:.85rem;color:var(--mut)}
.lnk{font-size:.85rem;font-weight:600;color:var(--g);padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:#fff}
.wrap{max-width:980px;margin:auto;padding:26px 20px 70px}
.hero{padding:10px 0 22px}
.hero small{color:var(--au);font-weight:700;letter-spacing:.16em;font-size:.72rem;text-transform:uppercase}
.hero h1{font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.1;margin:6px 0 8px}
.hero p{color:var(--mut);max-width:560px}
.sum{background:var(--g);color:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.sum div{border-left:1px solid rgba(255,255,255,.14);padding-left:16px}.sum div:first-child{border:0;padding:0}
.sum b{display:block;font:700 1.9rem Fraunces,serif}.sum span{font-size:.78rem;opacity:.7;letter-spacing:.04em}
.sum .pos{color:#8ee6b8}.sum .neg{color:#ffb4a8}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cat h3{font-size:1rem;display:flex;gap:8px;align-items:center}.cat p{color:var(--mut);font-size:.8rem;margin-top:6px}
.cat b{color:var(--g);font-size:1.15rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink);font:600 .85rem Inter;padding:9px 16px;border-radius:99px;cursor:pointer}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.tabs.sub .tab{font-weight:500;font-size:.8rem;padding:6px 12px}.tabs.sub .tab.on{background:var(--ink);border-color:var(--ink)}
.tip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:4px 1fr auto;gap:16px;align-items:center}
.tip .st{align-self:stretch;border-radius:4px;background:var(--line)}
.tip.win .st{background:var(--win)}.tip.loss .st{background:var(--loss)}.tip.void .st{background:#b9b3a3}
.meta{font-size:.75rem;color:var(--mut);letter-spacing:.03em;margin-bottom:3px}
.match{font:700 1.05rem Fraunces,serif}
.pick{margin-top:6px;font-size:.9rem}.pick b{background:#eef5f0;color:var(--g);padding:2px 10px;border-radius:99px}
.note{color:var(--mut);font-size:.82rem;margin-top:6px}
.right{text-align:right}.odd{font:700 1.4rem Fraunces,serif;color:var(--au)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:99px;margin-top:4px;border:0;font-family:inherit}
.pill.pend{background:#f3efe2;color:#8a6d22}.pill.win{background:#dff3e8;color:var(--win)}.pill.loss{background:#fbe4e0;color:var(--loss)}.pill.void{background:#eceae3;color:#7b7667}
.adm{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.btn{font:600 .85rem Inter;background:var(--g);color:#fff;border:0;border-radius:12px;padding:11px 18px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:.74rem;border-radius:8px}.btn.del{color:var(--loss)}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;display:none}
.form.open{display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
label{font-size:.72rem;font-weight:600;color:var(--mut);display:block;margin-bottom:4px}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf6;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--g2);outline-offset:0;background:#fff}
.empty,.gate{text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px}
.gate{margin-top:40px;padding:50px 24px;border-style:solid}.gate h2{color:var(--ink);font-size:1.6rem;margin:8px 0}
.top2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
@media(max-width:700px){.sum{grid-template-columns:1fr 1fr}.sum div:nth-child(3){border:0;padding:0}.cats{grid-template-columns:1fr}.tip{grid-template-columns:4px 1fr}.right{grid-column:2;text-align:left;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.adm{margin:0}.who{display:none}}
</style>
</head>
<body>
<div class="bar"><div><a class="brand" href="/vip">Viking<span style="color:var(--au)">GOLD</span><i>VIP</i></a><span class="sp"></span><span class="who" id="who"></span><a class="lnk" href="/">← Főoldal</a></div></div>
<main class="wrap" id="app"><div class="empty">Betöltés…</div></main>
<script type="module">
import { firebaseConfig } from '/js/firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, setPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0'), ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const CATS = [['labdarugas', 'Labdarúgás', '⚽'], ['jegkorong', 'Jégkorong', '🏒'], ['kezilabda', 'Kézilabda', '🤾']];
const LAB = { pend: 'Függőben', win: 'Nyert', loss: 'Vesztett', void: 'Érvénytelen' }, NEXT = { pend: 'win', win: 'loss', loss: 'void', void: 'pend' };
const gate = (t, p, x = '') => { app.innerHTML = `<div class="gate"><div style="font-size:2rem">★</div><h2>${t}</h2><p>${p}</p>${x}</div>`; };

const auth = getAuth(initializeApp(firebaseConfig)), db = getFirestore(auth.app);
let isAdmin = false, tips = [], cat = 'all', day = 'all', open = false, editId = null;
setPersistence(auth, browserSessionPersistence).catch(() => { }).finally(() => onAuthStateChanged(auth, init));

async function init(u) {
  if (!u) return gate('VIP Klub', 'A belépéshez jelentkezz be a fiókodba.', '<p style="margin-top:18px"><a class="btn" href="/auth?mode=login">Belépés</a></p>');
  let p = null; try { const [a, b] = await Promise.all([getDoc(doc(db, 'admins', u.uid)), getDoc(doc(db, 'users', u.uid))]); isAdmin = a.exists(); p = b.exists() ? b.data() : null; } catch (e) { }
  $('#who').textContent = (p && p.name) || u.email;
  if (!isAdmin && !(p && p.vip && !p.disabled)) return gate('Ez a rész VIP tagoknak szól', 'Kérd meg valamelyik admint, hogy adjon VIP rangot a fiókodnak.', '<p style="margin-top:18px"><a class="btn ghost" href="/elerhetosegek">Elérhetőségek</a></p>');
  const me = (p && p.name) || u.email.split('@')[0];
  onSnapshot(query(collection(db, 'vipTips'), orderBy('date', 'desc'), limit(500)), s => { tips = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(me); },
    e => gate('Nem tölthető be', esc(e.code || e.message) + ' – ellenőrizd a Firestore szabályokat (vipTips).'));
}

const rec = l => { const w = l.filter(t => t.status === 'win').length, x = l.filter(t => t.status === 'loss').length;
  const pr = l.reduce((s, t) => s + (t.status === 'win' ? (+t.odds || 1) - 1 : t.status === 'loss' ? -1 : 0), 0);
  return { w, x, rate: w + x ? Math.round(w / (w + x) * 100) : null, pr, n: l.length }; };
const fmt = n => (n > 0 ? '+' : '') + n.toFixed(2);

function draw(me) {
  const R = rec(tips), today = ymd(new Date()), yest = ymd(new Date(Date.now() - 864e5));
  let list = tips.filter(t => (cat === 'all' || t.sport === cat) && (day === 'all' || (day === 'today' ? t.date === today : t.date === yest)));
  list.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  app.innerHTML = `
  <div class="hero"><small>Exkluzív tartalom</small><h1>Üdv a VIP Klubban, ${esc(me)}</h1><p>Válogatott tippek labdarúgásban, jégkorongban és kézilabdában – külön statisztikával, csak VIP tagoknak.</p></div>
  <div class="sum"><div><b>${R.n}</b><span>ÖSSZES TIPP</span></div><div><b>${R.w}–${R.x}</b><span>NYERT – VESZTETT</span></div><div><b>${R.rate == null ? '–' : R.rate + '%'}</b><span>TALÁLATI ARÁNY</span></div><div><b class="${R.pr >= 0 ? 'pos' : 'neg'}">${fmt(R.pr)}</b><span>PROFIT (EGYSÉG)</span></div></div>
  <div class="cats">${CATS.map(([k, n, i]) => { const r = rec(tips.filter(t => t.sport === k)); return `<div class="cat"><h3>${i} ${n}</h3><p><b>${r.rate == null ? '–' : r.rate + '%'}</b> találat · ${r.w}–${r.x} · ${fmt(r.pr)} egység</p></div>`; }).join('')}</div>
  <div class="top2"><div class="tabs" style="margin:0"><button class="tab ${cat === 'all' ? 'on' : ''}" data-c="all">Mind</button>${CATS.map(([k, n, i]) => `<button class="tab ${cat === k ? 'on' : ''}" data-c="${k}">${i} ${n}</button>`).join('')}</div>${isAdmin ? '<button class="btn" id="add">+ Új VIP tipp</button>' : ''}</div>
  <div class="tabs sub">${[['all', 'Összes nap'], ['today', 'Ma'], ['yest', 'Tegnap']].map(([k, n]) => `<button class="tab ${day === k ? 'on' : ''}" data-d="${k}">${n}</button>`).join('')}</div>
  ${isAdmin ? formHtml() : ''}
  <div id="list">${list.length ? list.map(card).join('') : '<div class="empty">Nincs megjeleníthető tipp ebben a szűrésben.</div>'}</div>`;
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; draw(me); });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { day = b.dataset.d; draw(me); });
  if (!isAdmin) return;
  $('#add').onclick = () => { open = !open; editId = null; draw(me); };
  const f = $('#vf'); if (f) { $('#cancel').onclick = () => { open = false; editId = null; draw(me); }; $('#save').onclick = save; }
  app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => updateDoc(doc(db, 'vipTips', b.dataset.st), { status: NEXT[b.dataset.cur] }));
  app.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { editId = b.dataset.ed; open = true; draw(me); scrollTo({ top: 0, behavior: 'smooth' }); });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => confirm('Törlöd a tippet?') && deleteDoc(doc(db, 'vipTips', b.dataset.rm)));
}

function card(t) {
  const c = CATS.find(x => x[0] === t.sport) || CATS[0], s = t.status || 'pend';
  return `<div class="tip ${s}"><div class="st"></div><div><div class="meta">${c[2]} ${c[1].toUpperCase()}${t.league ? ' · ' + esc(t.league) : ''} · ${esc(t.date)}${t.time ? ' ' + esc(t.time) : ''}</div>
  <div class="match">${esc(t.home)}${t.away ? ' – ' + esc(t.away) : ''}</div><div class="pick">Tipp: <b>${esc(t.pick)}</b></div>${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}</div>
  <div class="right">${t.odds ? `<div class="odd">${(+t.odds).toFixed(2)}</div>` : ''}<span class="pill ${s}">${LAB[s]}</span>
  ${isAdmin ? `<div class="adm"><button class="btn sm ghost" data-st="${t.id}" data-cur="${s}">Állapot ›</button><button class="btn sm ghost" data-ed="${t.id}">Szerk.</button><button class="btn sm ghost del" data-rm="${t.id}">✕</button></div>` : ''}</div></div>`;
}

function formHtml() {
  if (!open) return '';
  const t = tips.find(x => x.id === editId) || { sport: cat === 'all' ? 'labdarugas' : cat, date: ymd(new Date()) };
  const v = k => esc(t[k] ?? '');
  return `<div class="form open" id="vf"><h3 style="margin-bottom:12px">${editId ? 'Tipp szerkesztése' : 'Új VIP tipp'}</h3>
  <div class="fg"><div><label>Kategória</label><select id="f_sport">${CATS.map(([k, n]) => `<option value="${k}" ${t.sport === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
  <div><label>Dátum</label><input type="date" id="f_date" value="${v('date')}"></div><div><label>Időpont</label><input type="time" id="f_time" value="${v('time')}"></div><div><label>Bajnokság</label><input id="f_league" value="${v('league')}" placeholder="pl. NB I"></div></div>
  <div class="fg"><div><label>Hazai</label><input id="f_home" value="${v('home')}"></div><div><label>Vendég</label><input id="f_away" value="${v('away')}"></div><div><label>Tipp</label><input id="f_pick" value="${v('pick')}" placeholder="pl. 2.5 gól felett"></div><div><label>Odds</label><input id="f_odds" type="number" step="0.01" min="1" value="${v('odds')}"></div></div>
  <div style="margin-bottom:12px"><label>Megjegyzés (opcionális)</label><input id="f_note" value="${v('note')}"></div>
  <div style="display:flex;gap:8px"><button class="btn" id="save">Mentés</button><button class="btn ghost" id="cancel">Mégse</button></div></div>`;
}

async function save() {
  const g = k => $('#f_' + k).value.trim(), row = { sport: g('sport'), date: g('date'), time: g('time'), league: g('league'), home: g('home'), away: g('away'), pick: g('pick'), odds: parseFloat(g('odds')) || 0, note: g('note') };
  if (!row.date || !row.home || !row.pick) return alert('A dátum, a hazai csapat és a tipp kötelező.');
  try {
    if (editId) await updateDoc(doc(db, 'vipTips', editId), row);
    else await addDoc(collection(db, 'vipTips'), { ...row, status: 'pend', created: Date.now() });
    open = false; editId = null;
  } catch (e) { alert('Nem sikerült: ' + (e.code || e.message)); }
}
</script>
</body>
</html>
